# .github/workflows/docker-build-test.yml
name: Docker Build Test

on:
  push:
    branches: [feat/docker-image-optimization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ecs
          platforms: linux/arm64
          push: false
          tags: flexprice:test-${{ github.sha }}
          cache-from: type=gha,scope=flexprice-build-test
          cache-to: type=gha,mode=max,scope=flexprice-build-test
          outputs: type=docker